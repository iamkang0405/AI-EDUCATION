<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GPT 대화</title>
  <style>
    :root{--bg:#fff;--sidebar:#f7f7f8;--line:#e5e5e5;--muted:#6b6b6b;--text:#202123;--green:#10a37f;--soft:#f4f4f4}
    *{box-sizing:border-box} body{margin:0;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;background:var(--bg);height:100vh;overflow:hidden}
    .app{display:flex;height:100vh}.sidebar{width:260px;background:var(--sidebar);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:20px}
    .brand{display:flex;align-items:center;gap:10px;padding:8px 10px;font-weight:650;font-size:15px}.mark{width:28px;height:28px;border-radius:9px;background:#111;color:#fff;display:grid;place-items:center;font-size:15px}
    .new-chat{border:1px solid #d9d9d9;border-radius:8px;background:#fff;padding:11px 13px;text-align:left;font-size:14px;cursor:pointer}.new-chat:hover{background:#eee}
    .section-label{font-size:11px;color:#8b8b8b;font-weight:600;padding:0 11px;margin-bottom:5px}.history{flex:1;overflow:auto}.chat-row{display:flex;align-items:center;gap:3px;margin-bottom:2px}.chat-item{flex:1;padding:10px 12px;border-radius:7px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}.chat-item.active{background:#e9e9e9}.delete-chat{border:0;background:transparent;color:#888;border-radius:6px;padding:7px;cursor:pointer;opacity:0}.chat-row:hover .delete-chat,.chat-row:focus-within .delete-chat{opacity:1}.delete-chat:hover{background:#e3e3e3;color:#b42318}
    .profile{border-top:1px solid var(--line);padding:13px 9px 4px;display:flex;align-items:center;gap:10px;font-size:12px}.avatar{width:27px;height:27px;border-radius:50%;background:#d8a47f;display:grid;place-items:center;color:#fff;font-weight:700;overflow:hidden;flex:0 0 auto}.avatar img{width:100%;height:100%;object-fit:cover}
    .login-screen{position:fixed;inset:0;background:#fff;z-index:10;display:grid;place-items:center}.login-card{width:min(390px,calc(100% - 36px));text-align:center}.login-card .mark{margin:0 auto 18px}.login-card h1{font-size:24px;margin:0 0 9px}.login-card p{color:#777;font-size:14px;margin:0 0 24px}.login-card form{display:flex;gap:8px}.login-card input{flex:1;border:1px solid #ccc;border-radius:8px;padding:12px;font-size:16px;outline:none}.login-card input:focus{border-color:var(--green)}.login-card button{border:0;border-radius:8px;background:#111;color:#fff;padding:0 18px;cursor:pointer}.login-error{height:20px;color:#c0392b;font-size:12px;margin-top:10px}
    main{flex:1;display:flex;flex-direction:column;min-width:0}.topbar{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 25px;font-size:16px;font-weight:600}.topbar span{color:#777;font-weight:400;margin-left:7px}
    .messages{flex:1;overflow:auto;padding:32px 20px 150px}.welcome{max-width:760px;margin:14vh auto 0;text-align:center}.welcome h1{font-size:30px;margin:0 0 30px}.quick{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.quick button{border:1px solid var(--line);border-radius:9px;background:#fff;padding:11px 14px;color:#555;cursor:pointer}.quick button:hover{background:var(--soft)}
    .message{max-width:800px;margin:0 auto 25px;display:flex;gap:14px;line-height:1.65;font-size:15px}.message.user{justify-content:flex-end}.bubble{max-width:720px}.user .bubble{background:#f4f4f4;border-radius:17px;padding:9px 15px}.message img{max-width:280px;border-radius:10px;display:block;margin-top:8px}
    .composer-wrap{position:fixed;bottom:0;left:260px;right:0;background:linear-gradient(transparent,#fff 30%);padding:35px 20px 20px}.composer{max-width:800px;margin:auto;border:1px solid #cfcfcf;border-radius:15px;background:#fff;box-shadow:0 2px 8px #0000000d;padding:9px 10px 9px 14px}.attachment{display:none;gap:10px;align-items:center;margin:0 0 8px;padding:6px;background:#f7f7f8;border-radius:10px}.attachment.has-image{display:flex}.thumb{position:relative}.thumb img{width:76px;height:58px;object-fit:cover;border-radius:8px;display:block}.attachment-label{font-size:12px;color:#777}.remove{position:absolute;right:-6px;top:-6px;border:0;background:#333;color:#fff;border-radius:50%;width:18px;height:18px;cursor:pointer;font-size:11px}.drop-note{font-size:12px;color:#888}.input-row{display:flex;align-items:flex-end;gap:8px}.input-row textarea{flex:1;border:0;outline:0;resize:none;min-height:32px;max-height:130px;font:inherit;padding:5px 0}.icon-btn,.send{border:0;background:transparent;cursor:pointer;border-radius:8px;width:34px;height:34px;font-size:19px}.icon-btn:hover{background:#eee}.send{background:#111;color:#fff;font-size:15px}.send:disabled{background:#ccc}.disclaimer{text-align:center;color:#888;font-size:11px;margin-top:8px}
    @media(max-width:700px){.sidebar{display:none}.composer-wrap{left:0}.topbar{padding:0 16px}.messages{padding-left:14px;padding-right:14px}.welcome h1{font-size:25px}}
    .login-card form.pin-form{display:flex;justify-content:center;gap:10px}.login-card .pin-digit{width:54px;height:62px;border:1px solid #ccc;border-radius:10px;text-align:center;font-size:25px;outline:none;padding:0}.login-card .pin-digit:focus{border-color:var(--green);box-shadow:0 0 0 3px #10a37f1c}.login-card form.pin-form button{display:none}
  </style>
</head>
<body>
  <section class="login-screen" id="loginScreen"><div class="login-card"><div class="mark">✦</div><h1>나의 GPT</h1><p>사용하려면 사이트 비밀번호를 입력하세요.</p><form id="loginForm"><input id="sitePassword" type="password" inputmode="numeric" placeholder="비밀번호" autocomplete="current-password" required><button type="submit">입장</button></form><div class="login-error" id="loginError"></div></div></section>
  <div class="app">
    <aside class="sidebar"><div class="brand"><div class="mark">✦</div>나의 GPT</div><button class="new-chat" id="newChat">＋ 새 채팅</button><div class="history"><div class="section-label">내 대화</div><div id="chatList"></div></div><div class="profile"><div class="avatar"><img src="assets/profile-dog.png" alt="프로필 사진"></div><span>AI 전문가 교육 1조</span><span style="margin-left:auto;color:#888">•••</span></div></aside>
    <main><header class="topbar">GPT<span>▾</span></header><section class="messages" id="messages"><div class="welcome" id="welcome"><h1>무엇을 도와드릴까요?</h1><div class="quick"><button>아이디어를 함께 발전시켜줘</button><button>복잡한 내용을 쉽게 설명해줘</button><button>이미지를 분석해줘</button></div></div></section></main>
  </div>
  <div class="composer-wrap"><form class="composer" id="composer"><div class="attachment" id="attachment"></div><div class="input-row"><button type="button" class="icon-btn" id="attachBtn" title="이미지 첨부">＋</button><textarea id="prompt" rows="1" placeholder="메시지를 입력하세요..."></textarea><button class="send" id="sendBtn" title="보내기">↑</button></div><div class="drop-note">이미지를 붙여넣거나 여기로 드래그해서 분석할 수 있어요.</div><input type="file" id="fileInput" accept="image/*" hidden /></form><div class="disclaimer">GPT는 실수할 수 있습니다. 중요한 정보는 확인해 주세요.</div></div>
  <script>
    const $=s=>document.querySelector(s), messages=$('#messages'), prompt=$('#prompt'), attachment=$('#attachment'), fileInput=$('#fileInput'); let imageData=null;
    $('#loginForm').onsubmit=async e=>{e.preventDefault();const error=$('#loginError');error.textContent='확인 중...';try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('#sitePassword').value})});const data=await r.json();if(!r.ok)throw new Error(data.message);$('#loginScreen').remove()}catch(err){error.textContent=err.message||'로그인에 실패했습니다.'}};
    const STORE='my-gpt-chats-v1'; let chats=JSON.parse(localStorage.getItem(STORE)||'[]'), activeId=null;
    function save(){localStorage.setItem(STORE,JSON.stringify(chats))} function newChat(){activeId=crypto.randomUUID();chats.unshift({id:activeId,title:'새로운 대화',messages:[]});save();renderChats();renderMessages()}
    function renderChats(){const list=$('#chatList');list.innerHTML=chats.map(c=>`<div class="chat-row"><div class="chat-item ${c.id===activeId?'active':''}" data-id="${c.id}">${c.title}</div><button class="delete-chat" data-delete="${c.id}" title="대화 삭제">×</button></div>`).join('');list.querySelectorAll('.chat-item').forEach(x=>x.onclick=()=>{activeId=x.dataset.id;renderChats();renderMessages()});list.querySelectorAll('.delete-chat').forEach(x=>x.onclick=e=>{e.stopPropagation();chats=chats.filter(c=>c.id!==x.dataset.delete);if(activeId===x.dataset.delete)activeId=chats[0]?.id||null;if(!chats.length)newChat();else{save();renderChats();renderMessages()}})}
    function renderMessages(){messages.innerHTML='';const chat=chats.find(c=>c.id===activeId);if(!chat||!chat.messages.length){messages.innerHTML='<div class="welcome" id="welcome"><h1>무엇을 도와드릴까요?</h1><div class="quick"><button>아이디어를 함께 발전시켜줘</button><button>복잡한 내용을 쉽게 설명해줘</button><button>이미지를 분석해줘</button></div></div>';document.querySelectorAll('.quick button').forEach(b=>b.onclick=()=>{prompt.value=b.textContent;prompt.focus()});return}chat.messages.forEach(m=>messages.insertAdjacentHTML('beforeend',`<div class="message ${m.role==='user'?'user':''}"><div class="${m.role==='user'?'bubble':'mark'}">${m.role==='user'?m.text:'✦'}</div>${m.role==='user'?'<div class="avatar"><img src="assets/profile-dog.png" alt="프로필 사진"></div>':''}</div>`));messages.scrollTop=messages.scrollHeight}
    function addImage(file){if(!file||!file.type.startsWith('image/'))return;const reader=new FileReader();reader.onload=()=>{imageData=reader.result;attachment.innerHTML=`<div class="thumb"><img src="${imageData}"><button type="button" class="remove">×</button></div><span class="attachment-label">이미지 미리보기</span>`;attachment.classList.add('has-image');$('.remove').onclick=()=>{imageData=null;attachment.innerHTML='';attachment.classList.remove('has-image')};};reader.readAsDataURL(file)}
    $('#attachBtn').onclick=()=>fileInput.click(); fileInput.onchange=e=>addImage(e.target.files[0]);
    document.addEventListener('paste',e=>{const item=[...(e.clipboardData?.items||[])].find(x=>x.type.startsWith('image/'));if(item)addImage(item.getAsFile())});
    const composer=$('#composer'); composer.ondragover=e=>{e.preventDefault();composer.style.borderColor='var(--green)'}; composer.ondragleave=()=>composer.style.borderColor=''; composer.ondrop=e=>{e.preventDefault();composer.style.borderColor='';addImage(e.dataTransfer.files[0])};
    function send(){const text=prompt.value.trim();if(!text&&!imageData)return;const chat=chats.find(c=>c.id===activeId);if(!chat)newChat();const current=chats.find(c=>c.id===activeId);const safe=text.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));current.messages.push({role:'user',text:safe+(imageData?' [이미지 첨부]':'')},{role:'assistant',text:'좋아요. 이 화면은 초안입니다. 실제 GPT 응답은 서버의 API 연결을 추가하면 표시됩니다.'});if(current.title==='새로운 대화')current.title=text.slice(0,24)||'이미지 대화';save();renderChats();renderMessages();prompt.value='';prompt.style.height='auto';imageData=null;attachment.innerHTML='';attachment.classList.remove('has-image')}
    composer.onsubmit=e=>{e.preventDefault();send()}; prompt.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}}; $('#newChat').onclick=()=>newChat(); prompt.oninput=()=>{prompt.style.height='auto';prompt.style.height=Math.min(prompt.scrollHeight,130)+'px'}; if(!chats.length)newChat();else{activeId=chats[0].id;renderChats();renderMessages()}
  </script>
  <script>
    const loginForm=document.querySelector('#loginForm');loginForm.classList.add('pin-form');loginForm.innerHTML='<input class="pin-digit" maxlength="1" type="password" inputmode="numeric"><input class="pin-digit" maxlength="1" type="password" inputmode="numeric"><input class="pin-digit" maxlength="1" type="password" inputmode="numeric"><input class="pin-digit" maxlength="1" type="password" inputmode="numeric">';
    const pinDigits=[...document.querySelectorAll('.pin-digit')];let pinChecking=false;async function checkPin(){if(pinChecking)return;const value=pinDigits.map(x=>x.value).join('');if(value.length<4)return;pinChecking=true;$('#loginError').textContent='확인 중...';try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:value})});if(!r.ok)throw new Error();$('#loginScreen').remove()}catch(e){pinDigits.forEach(x=>x.value='');pinDigits[0].focus();$('#loginError').textContent='비밀번호가 틀렸습니다. 다시 입력해 주세요.';pinChecking=false}}pinDigits.forEach((x,i)=>{x.oninput=()=>{x.value=x.value.replace(/\D/g,'').slice(-1);if(x.value&&i<3)pinDigits[i+1].focus();if(i===3)checkPin()};x.onkeydown=e=>{if(e.key==='Backspace'&&!x.value&&i>0)pinDigits[i-1].focus()}});pinDigits[0].focus();
  </script>
  <script>
    async function send(){const text=prompt.value.trim();if(!text&&!imageData)return;const chat=chats.find(c=>c.id===activeId);if(!chat)newChat();const current=chats.find(c=>c.id===activeId);const userText=text+(imageData?' [이미지 첨부]':'');current.messages.push({role:'user',text:userText});if(current.title==='새로운 대화')current.title=text.slice(0,24)||'이미지 대화';save();renderChats();renderMessages();prompt.value='';prompt.style.height='auto';imageData=null;attachment.innerHTML='';attachment.classList.remove('has-image');const pending={role:'assistant',text:'답변을 생성하고 있습니다...'};current.messages.push(pending);renderMessages();try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:current.messages.filter(m=>m!==pending).map(m=>({role:m.role,content:m.text}))})});const data=await r.json();if(!r.ok)throw new Error(data.error||'API 요청에 실패했습니다.');pending.text=data.text||'응답이 비어 있습니다.'}catch(e){pending.text='오류가 발생했습니다: '+e.message}save();renderMessages()}
  </script>
  <script>
    async function send(){const text=prompt.value.trim();if(!text&&!imageData)return;const chat=chats.find(c=>c.id===activeId);if(!chat)newChat();const current=chats.find(c=>c.id===activeId);const userText=text+(imageData?' [이미지 첨부]':'');current.messages.push({role:'user',text:userText});if(current.title==='새로운 대화')current.title=text.slice(0,24)||'이미지 대화';save();renderChats();renderMessages();prompt.value='';prompt.style.height='auto';imageData=null;attachment.innerHTML='';attachment.classList.remove('has-image');const pending={role:'assistant',text:'AI가 생각 중입니다...'};current.messages.push(pending);renderMessages();const timer=setTimeout(()=>{pending.text='OpenAI API에 연결 중입니다...';renderMessages()},700);try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:current.messages.filter(m=>m!==pending).map(m=>({role:m.role,content:m.text}))})});const data=await r.json();if(!r.ok)throw new Error(data.error||`API 요청 실패 (${r.status})`);pending.text=data.text||'API 연결은 성공했지만 응답 내용이 비어 있습니다.'}catch(e){pending.text='연결되지 않았습니다. 이유: '+e.message}finally{clearTimeout(timer);save();renderMessages()}}
  </script>
</body>
</html>
