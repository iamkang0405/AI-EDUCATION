  <style>

    .message:not(.user) .bubble{max-width:720px;line-height:1.75;padding:10px 14px;color:#202123;overflow-wrap:anywhere}.message:not(.user) .bubble p{margin:0 0 12px}.message:not(.user) .bubble p:last-child{margin-bottom:0}.message:not(.user) .bubble h1,.message:not(.user) .bubble h2,.message:not(.user) .bubble h3{margin:4px 0 10px;line-height:1.35}.message:not(.user) .bubble h1{font-size:21px}.message:not(.user) .bubble h2{font-size:18px}.message:not(.user) .bubble h3{font-size:16px}.message:not(.user) .bubble ul,.message:not(.user) .bubble ol{margin:6px 0 14px;padding-left:24px}.message:not(.user) .bubble li{margin:4px 0}.message:not(.user) .bubble strong{font-weight:700}.message:not(.user) .bubble code{background:#f1f1f1;border-radius:4px;padding:2px 5px;font-size:.9em}
    .message:not(.user) .bubble .table-wrap{overflow-x:auto;margin:8px 0 16px}.message:not(.user) .bubble table{border-collapse:collapse;width:100%;min-width:440px;font-size:14px;line-height:1.5;background:#fff}.message:not(.user) .bubble th,.message:not(.user) .bubble td{border:1px solid #e1e1e1;padding:9px 11px;text-align:left;vertical-align:top}.message:not(.user) .bubble th{background:#f5f5f5;font-weight:700;color:#333}.message:not(.user) .bubble tr:nth-child(even) td{background:#fcfcfc}

    @media(max-width:700px){.sidebar{display:flex;position:fixed;z-index:8;inset:0 auto 0 0;width:260px;transform:translateX(-100%);transition:transform .2s ease;box-shadow:4px 0 18px #0002}.sidebar.open{transform:translateX(0)}.sidebar-toggle{display:inline-block;margin-top:27px}.sidebar-close{display:block}.composer-wrap{left:0}.topbar{height:calc(58px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 16px 0}.messages{padding-left:14px;padding-right:14px}.welcome h1{font-size:25px}}
    .login-card form.pin-form{display:flex;justify-content:center;gap:10px}.login-card .pin-digit{flex:0 0 58px;width:58px;height:58px;border:1px solid #ccc;border-radius:10px;text-align:center;font-size:25px;outline:none;padding:0}.login-card .pin-digit:focus{border-color:var(--green);box-shadow:0 0 0 3px #10a37f1c}.login-card form.pin-form button{display:none}
    .legal-note{margin-top:18px;color:#888;font-size:11px;line-height:1.6}.composer-legal{font-size:11px;color:#999;text-align:center;margin-top:5px}
    .follow-btn{display:none;position:absolute;bottom:175px;left:50%;transform:translateX(-50%);z-index:4;width:34px;height:34px;border:1px solid #ccc;background:#fff;border-radius:50%;color:#555;box-shadow:0 2px 8px #0002;cursor:pointer;font-size:18px;line-height:1}.follow-btn.visible{display:block}

<body>
  <section class="login-screen" id="loginScreen"><div class="login-card"><div class="mark">✦</div><h1>나의 GPT</h1><p>사용하려면 사이트 비밀번호를 입력하세요.</p><form id="loginForm"><input id="sitePassword" type="password" inputmode="numeric" placeholder="비밀번호" autocomplete="current-password" required><button type="submit">입장</button></form><div class="login-error" id="loginError"></div></div></section>
  <div class="app">
    <aside class="sidebar"><div class="brand"><div class="mark">✦</div>나의 GPT<button class="sidebar-close" id="sidebarClose" aria-label="나의 GPT 숨기기">×</button></div><button class="new-chat" id="newChat">＋ 새 채팅</button><div class="history"><div class="section-label">내 대화</div><div id="chatList"></div></div><div class="profile"><div class="avatar"><img src="assets/profile-dog.png" alt="프로필 사진"></div><span>AI 전문가 교육 1조</span><span style="margin-left:auto;color:#888">•••</span></div></aside>
    <main><header class="topbar"><button class="sidebar-toggle" id="sidebarToggle">☰ 나의 GPT</button>GPT</header><section class="messages" id="messages"><div class="welcome" id="welcome"><h1>무엇을 도와드릴까요?</h1><div class="quick"><button>아이디어를 함께 발전시켜줘</button><button>복잡한 내용을 쉽게 설명해줘</button><button>이미지를 분석해줘</button></div></div></section></main>
  </div>
  <div class="composer-wrap"><form class="composer" id="composer"><div class="attachment" id="attachment"></div><div class="input-row"><button type="button" class="icon-btn" id="attachBtn" title="이미지 첨부">＋</button><textarea id="prompt" rows="1" placeholder="메시지를 입력하세요..."></textarea><button class="send" id="sendBtn" title="보내기">↑</button></div><div class="drop-note">이미지를 붙여넣거나 여기로 드래그해서 분석할 수 있어요.</div><input type="file" id="fileInput" accept="image/*" hidden /></form><div class="disclaimer">GPT는 실수할 수 있습니다. 중요한 정보는 확인해 주세요.</div></div>
  <script>
    function formatMessage(value){const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'),inline=s=>esc(s.trim()).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');return value.split(/\n\n+/).map(block=>{const lines=block.trim().split('\n');if(lines.length>=2&&/^\s*\|?.+\|.+\|?\s*$/.test(lines[0])&&/^\s*\|?\s*:?-{3,}:?\s*\|/.test(lines[1])){const rows=lines.filter((_,i)=>i!==1).map(line=>line.trim().replace(/^\||\|$/g,'').split('|').map(inline));return '<div class="table-wrap"><table><thead><tr>'+rows[0].map(c=>'<th>'+c+'</th>').join('')+'</tr></thead><tbody>'+rows.slice(1).map(row=>'<tr>'+row.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}let s=esc(block.trim()).replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^## (.+)$/gm,'<h2>$1</h2>').replace(/^# (.+)$/gm,'<h1>$1</h1>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>');if(/^[-*] /m.test(s))return '<ul>'+s.split('\n').map(x=>x.replace(/^[-*] (.+)$/,'<li>$1</li>')).join('')+'</ul>';if(/^\d+\. /m.test(s))return '<ol>'+s.split('\n').map(x=>x.replace(/^\d+\. (.+)$/,'<li>$1</li>')).join('')+'</ol>';return '<p>'+s.replace(/\n/g,'<br>')+'</p>'}).join('')}
  </script>
  <script>
    const $=s=>document.querySelector(s), messages=$('#messages'), prompt=$('#prompt'), attachment=$('#attachment'), fileInput=$('#fileInput'); let imageData=null,userScrolledUp=false;$('#sidebarToggle').onclick=()=>$('.sidebar').classList.toggle('open');$('#sidebarClose').onclick=()=>$('.sidebar').classList.remove('open');
    $('#loginForm').onsubmit=async e=>{e.preventDefault();const error=$('#loginError');error.textContent='확인 중...';try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('#sitePassword').value})});const data=await r.json();if(!r.ok)throw new Error(data.message);$('#loginScreen').remove()}catch(err){error.textContent=err.message||'로그인에 실패했습니다.'}};
    const STORE='my-gpt-chats-v1'; let chats=JSON.parse(localStorage.getItem(STORE)||'[]'), activeId=null;
    function save(){localStorage.setItem(STORE,JSON.stringify(chats))} function newChat(){activeId=crypto.randomUUID();chats.unshift({id:activeId,title:'새로운 대화',messages:[]});save();renderChats();renderMessages()}
    function renderChats(){const list=$('#chatList');list.innerHTML=chats.map(c=>`<div class="chat-row"><div class="chat-item ${c.id===activeId?'active':''}" data-id="${c.id}">${c.title}</div><button class="delete-chat" data-delete="${c.id}" title="대화 삭제">×</button></div>`).join('');list.querySelectorAll('.chat-item').forEach(x=>x.onclick=()=>{activeId=x.dataset.id;renderChats();renderMessages()});list.querySelectorAll('.delete-chat').forEach(x=>x.onclick=e=>{e.stopPropagation();chats=chats.filter(c=>c.id!==x.dataset.delete);if(activeId===x.dataset.delete)activeId=chats[0]?.id||null;if(!chats.length)newChat();else{save();renderChats();renderMessages()}})}
    function formatMessage(value){return value.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').split(/\n\n+/).map(block=>{let s=block.trim();if(!s)return '';s=s.replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^## (.+)$/gm,'<h2>$1</h2>').replace(/^# (.+)$/gm,'<h1>$1</h1>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>');if(/^[-*] /m.test(s))s='<ul>'+s.split('\n').map(x=>x.replace(/^[-*] (.+)$/,'<li>$1</li>')).join('')+'</ul>';else if(/^\d+\. /m.test(s))s='<ol>'+s.split('\n').map(x=>x.replace(/^\d+\. (.+)$/,'<li>$1</li>')).join('')+'</ol>';else if(!/^<h[1-3]>/.test(s))s='<p>'+s.replace(/\n/g,'<br>')+'</p>';return s}).join('')}
    function renderMessages(){const stickToBottom=messages.scrollHeight-messages.scrollTop-messages.clientHeight<80;messages.innerHTML='';const chat=chats.find(c=>c.id===activeId);if(!chat||!chat.messages.length){messages.innerHTML='<div class="welcome" id="welcome"><h1>무엇을 도와드릴까요?</h1><div class="quick"><button>아이디어를 함께 발전시켜줘</button><button>복잡한 내용을 쉽게 설명해줘</button><button>이미지를 분석해줘</button></div></div>';document.querySelectorAll('.quick button').forEach(b=>b.onclick=()=>{prompt.value=b.textContent;prompt.focus()});return}chat.messages.forEach(m=>messages.insertAdjacentHTML('beforeend',m.role==='user'?`<div class="message user"><div class="bubble">${m.text}${m.image?`<img src="${m.image}" alt="첨부 이미지">`:''}</div><div class="avatar"><img src="assets/profile-dog.png" alt="프로필 사진"></div></div>`:`<div class="message"><div class="mark">✦</div><div class="bubble">${formatMessage(m.text)}</div></div>`));if(stickToBottom&&!userScrolledUp)messages.scrollTop=messages.scrollHeight}
    function addImage(file){if(!file||!file.type.startsWith('image/'))return;const reader=new FileReader();reader.onload=()=>{imageData=reader.result;attachment.innerHTML=`<div class="thumb"><img src="${imageData}"><button type="button" class="remove">×</button></div><span class="attachment-label">이미지 미리보기</span>`;attachment.classList.add('has-image');$('.remove').onclick=()=>{imageData=null;attachment.innerHTML='';attachment.classList.remove('has-image')};};reader.readAsDataURL(file)}
    $('#attachBtn').onclick=()=>fileInput.click(); fileInput.onchange=e=>addImage(e.target.files[0]);
    document.addEventListener('paste',e=>{const item=[...(e.clipboardData?.items||[])].find(x=>x.type.startsWith('image/'));if(item)addImage(item.getAsFile())});
    const composer=$('#composer'); composer.ondragover=e=>{e.preventDefault();composer.style.borderColor='var(--green)'}; composer.ondragleave=()=>composer.style.borderColor=''; composer.ondrop=e=>{e.preventDefault();composer.style.borderColor='';addImage(e.dataTransfer.files[0])};
    function send(){const text=prompt.value.trim();if(!text&&!imageData)return;const chat=chats.find(c=>c.id===activeId);if(!chat)newChat();const current=chats.find(c=>c.id===activeId);const safe=text.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));current.messages.push({role:'user',text:safe+(imageData?' [이미지 첨부]':'')},{role:'assistant',text:'좋아요. 이 화면은 초안입니다. 실제 GPT 응답은 서버의 API 연결을 추가하면 표시됩니다.'});if(current.title==='새로운 대화')current.title=text.slice(0,24)||'이미지 대화';save();renderChats();renderMessages();prompt.value='';prompt.style.height='auto';imageData=null;attachment.innerHTML='';attachment.classList.remove('has-image')}
    composer.onsubmit=e=>{e.preventDefault();send()}; prompt.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}}; $('#newChat').onclick=()=>newChat(); prompt.oninput=()=>{prompt.style.height='auto';prompt.style.height=Math.min(prompt.scrollHeight,130)+'px'}; if(!chats.length)newChat();else{activeId=chats[0].id;renderChats();renderMessages()}
  </script>
  <script>
    const loginForm=document.querySelector('#loginForm');loginForm.classList.add('pin-form');loginForm.innerHTML='<input class="pin-digit" maxlength="1" type="password" inputmode="numeric"><input class="pin-digit" maxlength="1" type="password" inputmode="numeric"><input class="pin-digit" maxlength="1" type="password" inputmode="numeric"><input class="pin-digit" maxlength="1" type="password" inputmode="numeric">';
    const pinDigits=[...document.querySelectorAll('.pin-digit')];let pinChecking=false;async function checkPin(){if(pinChecking)return;const value=pinDigits.map(x=>x.value).join('');if(value.length<4)return;pinChecking=true;$('#loginError').textContent='확인 중...';try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:value})});if(!r.ok)throw new Error();$('#loginScreen').remove()}catch(e){pinDigits.forEach(x=>x.value='');pinDigits[0].focus();$('#loginError').textContent='비밀번호가 틀렸습니다. 다시 입력해 주세요.';pinChecking=false}}pinDigits.forEach((x,i)=>{x.oninput=()=>{x.value=x.value.replace(/\D/g,'').slice(-1);if(x.value&&i<3)pinDigits[i+1].focus();if(i===3)checkPin()};x.onkeydown=e=>{if(e.key==='Backspace'&&!x.value&&i>0)pinDigits[i-1].focus()}});pinDigits[0].focus();
  </script>
  <script>
    async function send(){const text=prompt.value.trim();if(!text&&!imageData)return;const chat=chats.find(c=>c.id===activeId);if(!chat)newChat();const current=chats.find(c=>c.id===activeId);const userText=text+(imageData?' [이미지 첨부]':'');current.messages.push({role:'user',text:userText});if(current.title==='새로운 대화')current.title=text.slice(0,24)||'이미지 대화';save();renderChats();renderMessages();prompt.value='';prompt.style.height='auto';imageData=null;attachment.innerHTML='';attachment.classList.remove('has-image');const pending={role:'assistant',text:'답변을 생성하고 있습니다...'};current.messages.push(pending);renderMessages();try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:current.messages.filter(m=>m!==pending).map(m=>({role:m.role,content:m.text}))})});const data=await r.json();if(!r.ok)throw new Error(data.error||'API 요청에 실패했습니다.');pending.text=data.text||'응답이 비어 있습니다.'}catch(e){pending.text='오류가 발생했습니다: '+e.message}save();renderMessages()}
  </script>
  <script>
    let isResponding=false;async function typeResponse(message,text){const isTable=block=>{const lines=block.trim().split('\n');return lines.length>=2&&/^\s*\|?.+\|.+\|?\s*$/.test(lines[0])&&/^\s*\|?\s*:?-{3,}:?\s*\|/.test(lines[1])};const blocks=text.split(/(\n{2,})/);message.text='';for(const block of blocks){if(!block)continue;if(isTable(block)){message.text+='표를 정리하고 있습니다...';renderMessages();await new Promise(resolve=>setTimeout(resolve,250));message.text=message.text.replace('표를 정리하고 있습니다...',block);renderMessages()}else{for(const char of block){message.text+=char;renderMessages();await new Promise(resolve=>setTimeout(resolve,char==='\n'?72:7))}}}}
    async function send(){if(isResponding)return;const text=prompt.value.trim();if(!text&&!imageData)return;isResponding=true;prompt.disabled=true;$('#sendBtn').disabled=true;const chat=chats.find(c=>c.id===activeId);if(!chat)newChat();const current=chats.find(c=>c.id===activeId);const img=imageData;const userText=text+(img?' [이미지 첨부]':'');current.messages.push({role:'user',text:userText,image:img||null});if(current.title==='새로운 대화')current.title=text.slice(0,24)||'이미지 대화';save();renderChats();renderMessages();prompt.value='';prompt.style.height='auto';imageData=null;attachment.innerHTML='';attachment.classList.remove('has-image');const pending={role:'assistant',text:'AI가 생각 중입니다...'};current.messages.push(pending);renderMessages();const timer=setTimeout(()=>{pending.text='OpenAI API에 연결 중입니다...';renderMessages()},700);try{const apiMessages=current.messages.filter(m=>m!==pending).map(m=>({role:m.role,content:m.image?[{type:'input_text',text:m.text.replace(' [이미지 첨부]','')||'이 이미지를 분석해줘.'},{type:'input_image',image_url:m.image}]:m.text}));const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:apiMessages})});const data=await r.json();if(!r.ok)throw new Error(data.error||`API 요청 실패 (${r.status})`);await typeResponse(pending,data.text||'API 연결은 성공했지만 응답 내용이 비어 있습니다.')}catch(e){pending.text='연결되지 않았습니다. 이유: '+e.message}finally{clearTimeout(timer);isResponding=false;prompt.disabled=false;$('#sendBtn').disabled=false;save();renderMessages()}}
  </script>
  <script>
    const loginCard=document.querySelector('.login-card');const notice=document.createElement('div');notice.className='legal-note';notice.innerHTML='본 사이트는 교육 목적의 비공식 AI 서비스이며 OpenAI 또는 포스코퓨처엠의 공식 서비스가 아닙니다.<br>개인정보·사내 기밀자료·민감한 문서는 입력하거나 업로드하지 마세요.';loginCard.appendChild(notice);const composerLegal=document.createElement('div');composerLegal.className='composer-legal';composerLegal.textContent='입력 내용은 AI 분석을 위해 외부 API로 전송될 수 있습니다. AI 답변은 참고용이며 중요한 판단에는 전문가 검토가 필요합니다.';document.querySelector('.disclaimer').after(composerLegal);
  </script>
  <script>
    const followButton=document.createElement('button');followButton.className='follow-btn';followButton.id='followBtn';followButton.textContent='↓';followButton.title='최신 답변 따라가기';followButton.setAttribute('aria-label','최신 답변 따라가기');document.querySelector('.composer-wrap').prepend(followButton);const pauseAutoScroll=()=>{userScrolledUp=true;followButton.classList.add('visible')};messages.addEventListener('wheel',pauseAutoScroll,{passive:true});messages.addEventListener('touchmove',pauseAutoScroll,{passive:true});followButton.onclick=()=>{userScrolledUp=false;messages.scrollTop=messages.scrollHeight;followButton.classList.remove('visible')};
  </script>
  <script>
    const baseFormatMessage=formatMessage;formatMessage=function(value){const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'),inline=s=>esc(s.trim()).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');return value.split(/\n\n+/).map(block=>{const lines=block.trim().split('\n');if(lines.length>=2&&/^\s*\|?.+\|.+\|?\s*$/.test(lines[0])&&/^\s*\|?\s*:?-{3,}:?\s*\|/.test(lines[1])){const rows=lines.filter((_,i)=>i!==1).map(line=>line.trim().replace(/^\||\|$/g,'').split('|').map(inline));return '<div class="table-wrap"><table><thead><tr>'+rows[0].map(c=>'<th>'+c+'</th>').join('')+'</tr></thead><tbody>'+rows.slice(1).map(row=>'<tr>'+row.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}return baseFormatMessage(block)}).join('')};
  </script>
  <script>
    const resetFollowOnSend=()=>{userScrolledUp=false;followButton.classList.remove('visible')};composer.addEventListener('submit',resetFollowOnSend,true);prompt.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey)resetFollowOnSend()},true);
  </script>
</body>
</html>
